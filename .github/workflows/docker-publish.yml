name: Build and publish Web Docker image

on:
  push:
    branches: [master]
    tags: ['docker-v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Select image tags
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            tags+=("$image:latest")
          elif [[ "$GITHUB_REF" == refs/tags/docker-v* ]]; then
            tags+=("$image:$GITHUB_REF_NAME" "$image:${GITHUB_REF_NAME#docker-v}")
          fi
          {
            echo 'tags<<IMAGE_TAGS'
            printf '%s\n' "${tags[@]}"
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Web image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=docker-web-amd64
          cache-to: type=gha,mode=max,scope=docker-web-amd64
